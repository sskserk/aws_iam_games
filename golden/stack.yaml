AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates an EC2 instance, a PostgreSQL RDS instance, an IAM Role and InstanceProfile
  so the EC2 can access CloudWatch and request RDS metrics, Firehose streams, S3 bucket used to store logs.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/20
    Description: CIDR block for the VPC
  Subnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for subnet 1
  Subnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for subnet 2
  Subnet3Cidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for subnet 3
  EC2InstanceType:
    Type: String
    Default: t3.large
    Description: EC2 instance type
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class
  DBUsername:
    Type: String
    Default: elephant
    Description: RDS master username
  DBPassword:
    Type: String
    NoEcho: true
    Default: elephant123!
    Description: RDS master password (NoEcho)
  InternalDomainName:
    Type: String
    Default: internal.domain.local
    Description: Private hosted zone domain name
  AwideServerName:
    Type: String
    Default: awide-server
    Description: Hostname for the EC2 instance in the private hosted zone

Resources:
  # VPC and Networking Resources
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc
        - Key: Purpose
          Value: "CFN Platform VPC"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-rtb

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  ## subnets
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref Subnet1Cidr
      AvailabilityZone: !Select [ 0, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-subnet-a

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref Subnet2Cidr
      AvailabilityZone: !Select [ 1, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-subnet-b

  SubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref Subnet3Cidr
      AvailabilityZone: !Select [ 2, !GetAZs '' ]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-subnet-c

  SubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  SubnetCRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetC
      RouteTableId: !Ref RouteTable

  VpcSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${AWS::StackName}-security-group
      GroupDescription: CFN Platform security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: 0
          ToPort: 0
          CidrIp: 0.0.0.0/0  

  # EC2
  IAMRoleForEC2:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EC2DescribeTagsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                Resource: '*'
      Path: /
      Description: EC2 Role for CloudWatch and RDS metrics

  EC2Policy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: EC2CloudWatchRDSReadPolicy
      Roles:
        - !Ref IAMRoleForEC2
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:GetMetricData
              - cloudwatch:GetMetricStatistics
              - cloudwatch:ListMetrics
              - cloudwatch:DescribeAlarms
            Resource: "*"
          - Effect: Allow
            Action:
              - rds:DescribeDBInstances
              - rds:ListTagsForResource
              - rds:DescribeDBParameters
              - rds:DescribeDBLogFiles
              - rds:ModifyDBParameterGroup
            Resource: "*"

          - Effect: Allow
            Action:
              - ec2:DescribeInstanceTypes
            Resource: "*"
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:GetLogEvents
            Resource: "arn:aws:logs:*:*:*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref IAMRoleForEC2
      Path: /

  PrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref InternalDomainName
      VPCs:
        - VPCId: !Ref VPC
          VPCRegion: !Ref AWS::Region

  EC2DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateHostedZone
      Name: !Sub ${AwideServerName}.${InternalDomainName}
      Type: A
      TTL: 300
      ResourceRecords:
        - !GetAtt EC2Instance.PrivateIp  # Uses private IP

  EC2Instance:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /root/tools/cert_issue.sh:
              mode: "000755"
              owner: root
              group: root
              content: |
                #!/usr/bin/env bash
                set -euo pipefail

                ###############################################
                # CONFIGURATION
                ###############################################
                DOMAIN="example.com"  # Replace with your actual domain
                EMAIL="admin@example.com"  # Replace with your email for certbot notifications

                PORT80_CONTAINER="reverse-proxy"
                CONTAINER_RUNTIME="docker"
                CONTAINER_USER="root"

                # Append all output to this file.
                LOG_FILE="/var/log/awide_cert.log"

                ###############################################
                # INTERNALS
                ###############################################

                # This script uses the HTTP-01 challenge with certbot's standalone mode.
                # Ensure ports 80 and 443 are open and your domain points to this server.

                mkdir -p "$(dirname "$LOG_FILE")"
                exec > >(tee -a "$LOG_FILE") 2>&1

                ctr() {
                  sudo -iu "$CONTAINER_USER" "$CONTAINER_RUNTIME" "$@"
                }


                # Check if port 80 is in use
                if lsof -i :80 -sTCP:LISTEN -t >/dev/null 2>&1; then
                  # Port 80 is in use, try to stop the container
                  if ctr inspect "$PORT80_CONTAINER" >/dev/null 2>&1; then
                    if ctr inspect -f '{{.State.Running}}' "$PORT80_CONTAINER" | grep -q true; then
                      ctr stop "$PORT80_CONTAINER"
                      trap 'ctr start "$PORT80_CONTAINER"' EXIT
                    else
                      echo "Error: Port 80 is in use but $PORT80_CONTAINER is not running. Please free port 80 manually." >&2
                      exit 1
                    fi
                  else
                    echo "Error: Port 80 is in use but container $PORT80_CONTAINER does not exist. Please free port 80 manually." >&2
                    exit 1
                  fi
                else
                  echo "Port 80 is free, proceeding without stopping any container."
                fi

                certbot certonly \
                  --standalone \
                  --preferred-challenges http \
                  --non-interactive \
                  --agree-tos \
                  -m "$EMAIL" \
                  -d "$DOMAIN"

                cp "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" "/opt/awide/eco/nginx/ssl/certificate.pem"
                cp "/etc/letsencrypt/live/$DOMAIN/privkey.pem" "/opt/awide/eco/nginx/ssl/key.pem"    
            /root/tools/cert_daily_check.sh:
              mode: "000755"
              owner: root
              group: root
              content: |   
                #!/usr/bin/env bash
                set -euo pipefail

                ###############################################
                # CONFIGURATION
                ###############################################
                DOMAIN="example.com"

                # Container currently using host port 80
                PORT80_CONTAINER="reverse-proxy"
                CONTAINER_RUNTIME="docker"
                CONTAINER_USER="root"

                # Where to copy cert/key for your proxy
                TARGET_CERT_DIR="/opt/awide/eco/nginx/ssl"

                # Renewal threshold (days)
                RENEW_BEFORE_DAYS=7

                # Append all output to this file.
                LOG_FILE="/var/log/awide_cert.log"

                ###############################################
                # INTERNALS
                ###############################################
                SECONDS_THRESHOLD=$((RENEW_BEFORE_DAYS * 24 * 3600))
                LIVE_DIR="/etc/letsencrypt/live/${DOMAIN}"
                FULLCHAIN="${LIVE_DIR}/fullchain.pem"
                PRIVKEY="${LIVE_DIR}/privkey.pem"

                log() {
                  echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $*"
                }

                mkdir -p "$(dirname "$LOG_FILE")"
                exec >> "$LOG_FILE" 2>&1

                need_cmd() {
                  command -v "$1" >/dev/null 2>&1 || {
                    echo "Missing required command: $1" >&2
                    exit 1
                  }
                }

                need_cmd sudo
                need_cmd "$CONTAINER_RUNTIME"
                need_cmd certbot
                need_cmd openssl

                ctr() {
                  sudo -iu "$CONTAINER_USER" "$CONTAINER_RUNTIME" "$@"
                }

                container_running() {
                  local c="$1"
                  [[ "$(ctr inspect -f '{{.State.Running}}' "$c" 2>/dev/null || true)" == "true" ]]
                }

                stop_container_if_running() {
                  local c="$1"
                  if container_running "$c"; then
                    log "Stopping container: $c"
                    ctr stop "$c" >/dev/null
                    return 0
                  fi
                  return 1
                }

                start_container() {
                  local c="$1"
                  log "Starting container: $c"
                  ctr start "$c" >/dev/null
                }

                copy_certs() {
                  mkdir -p "$TARGET_CERT_DIR"
                  cp "$FULLCHAIN" "$TARGET_CERT_DIR/certificate.pem"
                  cp "$PRIVKEY" "$TARGET_CERT_DIR/key.pem"
                  log "Certificates copied to $TARGET_CERT_DIR"
                }

                should_renew=true

                if [[ ! -f "$FULLCHAIN" || ! -f "$PRIVKEY" ]]; then
                  log "Certificate files not found. Initial issuance required."
                  should_renew=true
                else
                  if openssl x509 -checkend "$SECONDS_THRESHOLD" -noout -in "$FULLCHAIN"; then
                    log "Certificate is valid for more than ${RENEW_BEFORE_DAYS} days. No renewal needed."
                    should_renew=false
                  else
                    log "Certificate expires in less than ${RENEW_BEFORE_DAYS} days. Renewal required."
                    should_renew=true
                  fi
                fi


                if [[ "$should_renew" == "false" ]]; then
                  log "Skipping copy/restart because renewal is not required."
                  exit 0
                fi

                stopped_port80_container=false
                if stop_container_if_running "$PORT80_CONTAINER"; then
                  stopped_port80_container=true
                fi

                cleanup() {
                  if [[ "$stopped_port80_container" == "true" ]]; then
                    start_container "$PORT80_CONTAINER"
                  fi
                }
                trap cleanup EXIT

                log "Requesting/Renewing certificate for domain: $DOMAIN"
                certbot renew --non-interactive

                copy_certs

                if [[ -n "$PORT80_CONTAINER" ]]; then
                  log "Restarting TLS container: $PORT80_CONTAINER"
                  ctr restart "$PORT80_CONTAINER" >/dev/null
                fi

                log "Let's Encrypt weekly check completed successfully."
            /root/tools/setup_db_mount.sh:
              mode: "000755"
              owner: root
              group: root
              content: |
                #!/usr/bin/env bash

                # Idempotent disk setup script:
                # - Ensures DEVICE has an ext4 filesystem (creates it only when needed).
                # - Ensures MOUNT_POINT has a stable /etc/fstab entry by UUID.
                # - Ensures the filesystem is mounted on MOUNT_POINT.
                #
                # Usage:
                #   sudo ./setup_disk.sh [--dry-run] [--force]
                #
                # Flags:
                #   --dry-run  Print actions without changing the system.
                #   --force    Allow destructive mkfs when an existing filesystem is not ext4.

                set -euo pipefail

                DEVICE="/dev/sda1"
                MOUNT_POINT="/opt/awide"

                DRY_RUN=false
                FORCE=false

                for arg in "$@"; do
                  case "$arg" in
                    --dry-run) DRY_RUN=true ;;
                    --force)   FORCE=true ;;
                    *)
                      echo "Error: Unknown argument: $arg" >&2
                      echo "Usage: sudo $0 [--dry-run] [--force]" >&2
                      exit 1
                      ;;
                  esac
                done

                run() {
                  if [[ "$DRY_RUN" == true ]]; then
                    echo "[DRY RUN] $*"
                  else
                    "$@"
                  fi
                }

                backup_file_once() {
                  local src="$1"
                  local ts
                  ts=$(date +%Y%m%d_%H%M%S)
                  run cp "$src" "${src}.backup.${ts}"
                  echo "Backup created: ${src}.backup.${ts}"
                }

                is_mountpoint() {
                  # True only if PATH is an actual mount point.
                  local p="$1"
                  if command -v mountpoint >/dev/null 2>&1; then
                    mountpoint -q "$p"
                  else
                    # Fallback: compare the nearest mount target with the path itself.
                    local t
                    t=$(findmnt -n -o TARGET --target "$p" 2>/dev/null || true)
                    [[ "$t" == "$p" ]]
                  fi
                }

                if [[ "$DRY_RUN" == true ]]; then
                  echo "*** DRY RUN MODE - No changes will be made ***"
                  echo ""
                fi

                if [[ $EUID -ne 0 ]] && [[ "$DRY_RUN" == false ]]; then
                  echo "Error: This script must be run as root (use sudo)" >&2
                  exit 1
                fi

                echo "=== Disk Setup Script (Idempotent) ==="
                echo "Device: $DEVICE"
                echo "Mount Point: $MOUNT_POINT"
                echo "Dry-run: $DRY_RUN"
                echo "Force: $FORCE"
                echo ""

                echo "Step 1: Resolving device name..."
                if [[ "$DRY_RUN" == true ]]; then
                  echo "[DRY RUN] readlink -f $DEVICE"
                  REAL_DEVICE="$DEVICE"
                else
                  REAL_DEVICE=$(readlink -f "$DEVICE")
                fi
                echo "Real device: $REAL_DEVICE"
                echo ""

                echo "Step 2: Ensuring mount point directory exists..."
                run mkdir -p "$MOUNT_POINT"
                echo "Mount point directory ready: $MOUNT_POINT"
                echo ""

                # Step 3: Check whether MOUNT_POINT is a real mount point.
                # Important: findmnt --target shows the backing filesystem even if there is no dedicated mount.
                # Therefore we must use mountpoint semantics here.
                echo "Step 3: Checking whether $MOUNT_POINT is already a mount point..."
                if [[ "$DRY_RUN" == true ]]; then
                  echo "[DRY RUN] mountpoint -q $MOUNT_POINT"
                  echo "[DRY RUN] If it is a mount point, would compare mounted UUID with device UUID."
                  echo ""
                else
                  if is_mountpoint "$MOUNT_POINT"; then
                    MOUNTED_UUID=$(findmnt -n -o UUID --target "$MOUNT_POINT" 2>/dev/null || true)
                    MOUNTED_SRC=$(findmnt -n -o SOURCE --target "$MOUNT_POINT" 2>/dev/null || true)
                    echo "Already mounted: source=$MOUNTED_SRC uuid=$MOUNTED_UUID"

                    DEVICE_UUID=$(blkid -s UUID -o value "$REAL_DEVICE" 2>/dev/null || true)

                    if [[ -n "$DEVICE_UUID" && -n "$MOUNTED_UUID" && "$DEVICE_UUID" == "$MOUNTED_UUID" ]]; then
                      echo "Mount point is already mounted with the expected UUID. No remount needed."
                    else
                      echo "Error: $MOUNT_POINT is mounted from a different filesystem." >&2
                      echo "Mounted: source=$MOUNTED_SRC uuid=$MOUNTED_UUID" >&2
                      echo "Target device: $REAL_DEVICE uuid=${DEVICE_UUID:-<none>}" >&2
                      echo "Refusing to modify /etc/fstab or remount." >&2
                      exit 1
                    fi
                  else
                    echo "Not a mount point yet."
                  fi
                  echo ""
                fi

                echo "Step 4: Detecting filesystem type on $REAL_DEVICE..."
                FS_TYPE=""
                if [[ "$DRY_RUN" == true ]]; then
                  echo "[DRY RUN] blkid -o value -s TYPE $REAL_DEVICE"
                  FS_TYPE=""
                  echo "Filesystem type (simulated): <none>"
                else
                  FS_TYPE=$(blkid -o value -s TYPE "$REAL_DEVICE" 2>/dev/null || true)
                  echo "Filesystem type: ${FS_TYPE:-<none>}"
                fi
                echo ""

                echo "Step 5: Ensuring ext4 filesystem..."
                if [[ -z "$FS_TYPE" ]]; then
                  echo "No filesystem detected. Creating ext4 on $REAL_DEVICE."
                  run mkfs.ext4 -F "$REAL_DEVICE"
                  echo "ext4 filesystem created."
                elif [[ "$FS_TYPE" == "ext4" ]]; then
                  echo "ext4 filesystem already present. Skipping mkfs."
                else
                  echo "Existing filesystem is '$FS_TYPE' (not ext4)."
                  if [[ "$FORCE" == true ]]; then
                    echo "--force provided. Recreating filesystem as ext4 (DESTRUCTIVE)."
                    run mkfs.ext4 -F "$REAL_DEVICE"
                    echo "ext4 filesystem created."
                  else
                    echo "Error: Refusing to format. Re-run with --force to overwrite '$FS_TYPE' with ext4." >&2
                    exit 1
                  fi
                fi
                echo ""

                echo "Step 6: Getting UUID for $REAL_DEVICE..."
                if [[ "$DRY_RUN" == true ]]; then
                  echo "[DRY RUN] blkid -s UUID -o value $REAL_DEVICE"
                  UUID="12345678-1234-1234-1234-123456789abc"
                  echo "UUID (simulated): $UUID"
                else
                  sleep 1
                  UUID=$(blkid -s UUID -o value "$REAL_DEVICE" 2>/dev/null || true)
                  if [[ -z "$UUID" ]]; then
                    echo "Error: Could not retrieve UUID for $REAL_DEVICE" >&2
                    exit 1
                  fi
                  echo "UUID: $UUID"
                fi
                echo ""

                echo "Step 7: Ensuring persistent mount in /etc/fstab..."
                FSTAB_FILE="/etc/fstab"
                FSTAB_ENTRY="UUID=$UUID $MOUNT_POINT ext4 defaults 0 2"

                if [[ "$DRY_RUN" == true ]]; then
                  echo "[DRY RUN] Ensure fstab has: $FSTAB_ENTRY"
                else
                  if awk -v mp="$MOUNT_POINT" '($1 !~ /^#/ && $2 == mp) {found=1} END{exit found?0:1}' "$FSTAB_FILE"; then
                    CURRENT_LINE=$(awk -v mp="$MOUNT_POINT" '($1 !~ /^#/ && $2 == mp) {print; exit}' "$FSTAB_FILE")
                    if [[ "$CURRENT_LINE" == "$FSTAB_ENTRY" ]]; then
                      echo "fstab entry already correct. Skipping modification."
                    else
                      backup_file_once "$FSTAB_FILE"
                      awk -v mp="$MOUNT_POINT" -v repl="$FSTAB_ENTRY" '
                        {
                          if ($0 ~ /^#/) { print $0; next }
                          if ($2 == mp) { print repl; next }
                          print $0
                        }' "$FSTAB_FILE" > "${FSTAB_FILE}.tmp"
                      mv "${FSTAB_FILE}.tmp" "$FSTAB_FILE"
                      echo "Updated fstab entry for: $MOUNT_POINT"
                    fi
                  else
                    backup_file_once "$FSTAB_FILE"
                    echo "$FSTAB_ENTRY" >> "$FSTAB_FILE"
                    echo "Added fstab entry: $FSTAB_ENTRY"
                  fi
                fi
                echo ""

                echo "Step 8: Ensuring the filesystem is mounted on $MOUNT_POINT..."
                if [[ "$DRY_RUN" == true ]]; then
                  echo "[DRY RUN] If not a mount point, would run: mount $MOUNT_POINT"
                else
                  if is_mountpoint "$MOUNT_POINT"; then
                    echo "Already mounted. Nothing to do."
                  else
                    # Prefer mounting via fstab.
                    mount "$MOUNT_POINT" 2>/dev/null || mount "$REAL_DEVICE" "$MOUNT_POINT"
                    echo "Mounted: $REAL_DEVICE -> $MOUNT_POINT"
                  fi
                fi
                echo ""

                echo "=== Verification ==="
                if [[ "$DRY_RUN" == true ]]; then
                  echo "[DRY RUN] df -h $MOUNT_POINT"
                  echo "[DRY RUN] grep -n -- \" $MOUNT_POINT \" /etc/fstab"
                else
                  df -h "$MOUNT_POINT" || true
                  echo ""
                  grep -n -- " $MOUNT_POINT " /etc/fstab || true
                fi
                echo ""
                echo "=== Setup Complete ==="


    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref EC2InstanceType
      SecurityGroupIds:
        - !Ref VpcSecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref SubnetA
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 50  # Size in GB
            VolumeType: gp3
            Iops: 3000
            DeleteOnTermination: true
            Encrypted: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          dnf update -y

          # Ensure CloudFormation helper scripts are available and run cfn-init
          dnf install -y aws-cfn-bootstrap || true
          /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource EC2Instance --region ${AWS::Region} || true

          /root/tools/setup_db_mount.sh --force > /var/log/db_mount_setup.log 2>&1 || true

          dnf install docker certbot openssl cronie -y

          mkdir -p /etc/docker || true
          echo "{ \"data-root\": \"/opt/awide/docker\" }" > /etc/docker/daemon.json

          systemctl enable --now docker
          systemctl enable --now crond

          sudo mkdir -p /usr/local/lib/docker/cli-plugins

          # Download the latest Docker Compose plugin
          sudo curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose

          # Make it executable
          sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          ln -s /usr/local/lib/docker/cli-plugins/docker-compose /usr/bin/docker-compose

          systemctl start docker

          # Create the awideapp user
          useradd -m -s /bin/bash awideapp          
         
          # Add user to sudo group
          usermod -aG wheel awideapp
          
          # Allow passwordless sudo
          echo "awideapp ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/awideapp
          chmod 440 /etc/sudoers.d/awideapp

          # Set environment variables for the awideapp user
          cat > /etc/profile.d/awide-env.sh <<'EOF'
          export S3_LOGS_BUCKET_NAME=''
          export S3_LOGS_BUCKET_ARN=''
          export AWIDE_PRIVATE_DNS=''
          EOF



          chmod +x /etc/profile.d/awide-env.sh
          source /etc/profile.d/awide-env.sh || true

          mkdir -p /etc/yum.repos.d
          cat >/etc/yum.repos.d/awidelabs.repo <<EOL
          [awidelabs]
          name=awidelabs
          baseurl=https://nexus.awide.tech/repository/yum-packages
          enabled=1
          gpgcheck=1
          gpgkey=https://nexus.awide.tech/repository/awidelabs-raw/awide.pub.asc
          repo_gpgcheck=0
          priority=1
          deltarpm=0
          EOL

      Tags:
        - Key: Name
          Value: !Sub "AWIDE-EC2-Instance-${AWS::StackName}"


Outputs:
  EC2Hostname:
    Description: EC2 Public DNS (for SSH)
    Value: !GetAtt EC2Instance.PublicDnsName

  EC2User:
    Description: EC2 SSH Username
    Value: ubuntu

  EC2PublicIP:
    Description: EC2 Public IP (for SSH)
    Value: !GetAtt EC2Instance.PublicIp

  IAMRoleArn:
    Description: IAM Role ARN for EC2
    Value: !GetAtt IAMRoleForEC2.Arn
